import com.github.spotbugs.snom.Confidence
import com.github.spotbugs.snom.Effort
import com.github.spotbugs.snom.SpotBugsTask

plugins {
    id("application")
    id("com.github.spotbugs") version "6.5.12"
    id("org.checkerframework") version "1.0.2"
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly("com.github.spotbugs:spotbugs-annotations:4.10.4")
    compileOnly("org.checkerframework:checker-qual:4.3.1")
    compileOnly(project(":auki"))
    annotationProcessor(project(":auki"))
    testCompileOnly("com.github.spotbugs:spotbugs-annotations:4.10.4")
    testAnnotationProcessor(project(":auki"))
    testCompileOnly("org.checkerframework:checker-qual:4.3.1")
    testImplementation("org.junit.jupiter:junit-jupiter-api:6.1.3")
    testImplementation("org.junit.jupiter:junit-jupiter-params:6.1.3")
    testImplementation("org.assertj:assertj-core:3.27.7")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher:6.1.3")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:6.1.3")
}

spotbugs {
    toolVersion.set "4.10.4"
    showProgress.set true
    includeFilter.set file("spotbugs-include.xml")
    excludeFilter.set file("spotbugs-exclude.xml")
    effort.set Effort.valueOf("MAX")
    reportLevel.set Confidence.valueOf("LOW")
}

application {
    mainModule.set "greenspun"
    mainClass.set "greenspun.cli.Main"
}

java.toolchain {
    languageVersion = JavaLanguageVersion.of(21)
}

jar.manifest.attributes "Main-Class": application.mainClass.get()

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += [
            "-Xlint",
            "-Xlint:-processing,-requires-automatic,-serial",
    ]
}

javadoc {
    options.addStringOption("-show-module-contents", "all")
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

tasks.withType(SpotBugsTask).configureEach {
    reports {
        xml.required = false
        html.required = true
    }
}

checkerFramework {
    version = "4.3.1"
    skipCheckerFramework = true
    extraJavacArgs = [
            "-Alint=redundantNullComparison",
            "-AshowSuppressWarningsStrings",
            "-AwarnUnneededSuppressions",
            "-ArequirePrefixInWarningSuppressions",
    ]
    checkers = ["org.checkerframework.checker.nullness.NullnessChecker"]
}
