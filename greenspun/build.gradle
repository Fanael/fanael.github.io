import com.github.spotbugs.snom.Confidence
import com.github.spotbugs.snom.Effort
import com.github.spotbugs.snom.SpotBugsTask

plugins {
    id "application"
    id "com.github.spotbugs" version "6.0.25"
    id "org.checkerframework" version "0.6.38" apply false
}

ext.withCF = project.hasProperty("withCF")

if (ext.withCF) {
    apply plugin: "org.checkerframework"
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly "com.github.spotbugs:spotbugs-annotations:4.8.6"
    compileOnly "org.checkerframework:checker-qual:3.42.0"
    compileOnly project(":auki")
    annotationProcessor project(":auki")
    testCompileOnly "com.github.spotbugs:spotbugs-annotations:4.8.6"
    testAnnotationProcessor project(":auki")
    testCompileOnly "org.checkerframework:checker-qual:3.42.0"
    testImplementation "org.junit.jupiter:junit-jupiter-api:5.11.3"
    testImplementation "org.junit.jupiter:junit-jupiter-params:5.11.3"
    testImplementation "org.assertj:assertj-core:3.26.3"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.11.3"
}

spotbugs {
    toolVersion.set "4.8.6"
    showProgress.set true
    includeFilter.set file("spotbugs-include.xml")
    excludeFilter.set file("spotbugs-exclude.xml")
    effort.set Effort.valueOf("MAX")
    reportLevel.set Confidence.valueOf("LOW")
}

application {
    mainModule.set "greenspun"
    mainClass.set "greenspun.cli.Main"
}

java.toolchain {
    languageVersion = JavaLanguageVersion.of(21)
}

jar.manifest.attributes "Main-Class": application.mainClass.get()

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += [
            "-Xlint",
            "-Xlint:-processing,-requires-automatic,-serial",
    ]
}

javadoc {
    options.addStringOption("-show-module-contents", "all")
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

tasks.withType(SpotBugsTask).configureEach {
    reports {
        xml.required = false
        html.required = true
    }
}

if (ext.withCF) {
    checkerFramework {
        extraJavacArgs = [
                "-Alint=redundantNullComparison",
                "-AshowSuppressWarningsStrings",
                "-AwarnUnneededSuppressions",
                "-ArequirePrefixInWarningSuppressions",
        ]
        checkers = ["org.checkerframework.checker.nullness.NullnessChecker"]
    }
}
